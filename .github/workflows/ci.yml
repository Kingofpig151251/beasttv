name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 純邏輯測試：直接在 Node 裡載入真實 app.js，測判定／計分／排名／回合。
  # 不需要瀏覽器，幾秒跑完，是重寫時的主要行為防護網。
  logic:
    name: 行為邏輯測試
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 1. 取出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 3. 跑邏輯測試
        run: node --test tests/logic.test.js tests/real-app.test.js tests/endgame.test.js tests/turn.test.js tests/state.test.js tests/i18n.test.js tests/dom.test.js

  check:
    name: 靜態檢查 + 冒煙測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 1. 取出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 3. 靜態檢查（HTML 標籤／重複 id／站內連結）
        run: python tests/ci/static_check.py

      - name: 4. 安裝依賴
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright

      - name: 5. 安裝 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 6. 冒煙測試
        run: python tests/ci/smoke.py
