name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 靜態檢查 + 冒煙測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 1. 取出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 3. 靜態檢查（HTML 標籤／重複 id／站內連結）
        run: python tests/ci/static_check.py

      - name: 4. 安裝依賴
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright

      - name: 5. 安裝 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 6. 冒煙測試
        run: python tests/ci/smoke.py
